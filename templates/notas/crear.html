{% extends "base.html" %}
{% block title %}Nueva Nota{% endblock %}
{% block content %}

<div class="page-head">
    <h2>➕ Registrar Nota</h2>
    <a href="{{ url_for('notas.index') }}" class="btn btn-secondary">⬅️ Volver</a>
</div>

<div class="card">
    <form action="{{ url_for('notas.crear') }}" method="POST">
        <div class="form-grid">
            <div class="field">
                <label for="id_estudiante">Estudiante *</label>
                <select id="id_estudiante" name="id_estudiante" required>
                    <option value="">-- Seleccione --</option>
                    {% for e in estudiantes %}
                        <option value="{{ e.id_estudiante }}">{{ e.apellido }}, {{ e.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="id_asignatura">Asignatura *</label>
                <select id="id_asignatura" name="id_asignatura" required>
                    <option value="">-- Seleccione --</option>
                    {% for a in asignaturas %}
                        <option value="{{ a.id_asignatura }}">{{ a.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="field">
                <label for="nota1">Nota 1 (0 - 10) *</label>
                <input type="number" id="nota1" name="nota1" step="0.01" min="0" max="10" required>
            </div>
            <div class="field">
                <label for="nota2">Nota 2 (0 - 10) *</label>
                <input type="number" id="nota2" name="nota2" step="0.01" min="0" max="10" required>
            </div>
            <div class="field">
                <label for="examen">Examen (0 - 10) *</label>
                <input type="number" id="examen" name="examen" step="0.01" min="0" max="10" required>
            </div>
            <div class="field full">
                <label for="observacion">Observación</label>
                <textarea id="observacion" name="observacion" rows="2" maxlength="255"></textarea>
            </div>
            <div class="full actions">
                <button type="submit" class="btn btn-success">💾 Guardar</button>
                <a href="{{ url_for('notas.index') }}" class="btn btn-secondary">❌ Cancelar</a>
            </div>
        </div>
    </form>
</div>

{% endblock %}
