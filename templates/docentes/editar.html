{% extends "base.html" %}
{% block title %}Editar Docente{% endblock %}
{% block content %}

<div class="page-head">
    <h2>✏️ Editar Docente #{{ docente.id_docente }}</h2>
    <a href="{{ url_for('docentes.lista') }}" class="btn btn-secondary">⬅️ Volver</a>
</div>

<div class="card">
    <form action="{{ url_for('docentes.editar', id_docente=docente.id_docente) }}" method="POST">
        <div class="form-grid">
            <div class="field">
                <label for="cedula">Cédula *</label>
                <input type="text" id="cedula" name="cedula" maxlength="20"
                       value="{{ docente.cedula }}" required>
            </div>
            <div class="field">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" name="nombre" maxlength="100"
                       value="{{ docente.nombre }}" required>
            </div>
            <div class="field">
                <label for="apellido">Apellido *</label>
                <input type="text" id="apellido" name="apellido" maxlength="100"
                       value="{{ docente.apellido }}" required>
            </div>
            <div class="field">
                <label for="correo">Correo *</label>
                <input type="email" id="correo" name="correo" maxlength="120"
                       value="{{ docente.correo }}" required>
            </div>
            <div class="field">
                <label for="especialidad">Especialidad</label>
                <input type="text" id="especialidad" name="especialidad" maxlength="100"
                       value="{{ docente.especialidad or '' }}">
            </div>
            <div class="field">
                <label for="estado">Estado</label>
                <select id="estado" name="estado">
                    <option value="Activo"   {% if docente.estado == 'Activo' %}selected{% endif %}>Activo</option>
                    <option value="Inactivo" {% if docente.estado == 'Inactivo' %}selected{% endif %}>Inactivo</option>
                </select>
            </div>
            <div class="full actions">
                <button type="submit" class="btn btn-success">💾 Actualizar</button>
                <a href="{{ url_for('docentes.lista') }}" class="btn btn-secondary">❌ Cancelar</a>
            </div>
        </div>
    </form>
</div>

{% endblock %}
