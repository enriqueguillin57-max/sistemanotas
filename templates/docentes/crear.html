{% extends "base.html" %}
{% block title %}Nuevo Docente{% endblock %}
{% block content %}

<div class="page-head">
    <h2>➕ Registrar Docente</h2>
    <a href="{{ url_for('docentes.lista') }}" class="btn btn-secondary">⬅️ Volver</a>
</div>

<div class="card">
    <form action="{{ url_for('docentes.crear') }}" method="POST">
        <div class="form-grid">
            <div class="field">
                <label for="cedula">Cédula *</label>
                <input type="text" id="cedula" name="cedula" maxlength="20" required>
            </div>
            <div class="field">
                <label for="nombre">Nombre *</label>
                <input type="text" id="nombre" name="nombre" maxlength="100" required>
            </div>
            <div class="field">
                <label for="apellido">Apellido *</label>
                <input type="text" id="apellido" name="apellido" maxlength="100" required>
            </div>
            <div class="field">
                <label for="correo">Correo *</label>
                <input type="email" id="correo" name="correo" maxlength="120" required>
            </div>
            <div class="field">
                <label for="especialidad">Especialidad</label>
                <input type="text" id="especialidad" name="especialidad" maxlength="100">
            </div>
            <div class="field">
                <label for="estado">Estado</label>
                <select id="estado" name="estado">
                    <option value="Activo">Activo</option>
                    <option value="Inactivo">Inactivo</option>
                </select>
            </div>
            <div class="full actions">
                <button type="submit" class="btn btn-success">💾 Guardar</button>
                <a href="{{ url_for('docentes.lista') }}" class="btn btn-secondary">❌ Cancelar</a>
            </div>
        </div>
    </form>
</div>

{% endblock %}
